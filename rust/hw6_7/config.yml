pipeline:
- type: cargo
  title: Test 01_newtype_wrapper
  limits: &id001
    memory: 2G
    fsize: 1G
  cmd: test
  args:
  - --test
  - 01_newtype_wrapper
- type: cargo
  title: Run linter (cargo clippy) on 01_newtype_wrapper
  limits: *id001
  cmd: clippy
  args:
  - --test
  - 01_newtype_wrapper
  - --keep-going
  - --
  - -Adead_code
